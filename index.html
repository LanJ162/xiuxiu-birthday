<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秀秀生日快乐 🎂</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: #0a0a1a;
  color: #e8d5b7;
  overflow-x: hidden;
  line-height: 1.6;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0a0a1a; }
::-webkit-scrollbar-thumb { background: #41b883; border-radius: 3px; }

/* ===== Qingque Theme Variables ===== */
:root {
  --jade: #41b883;
  --jade-dark: #2d8a5e;
  --jade-light: #7ed6a5;
  --gold: #d4a853;
  --cream: #e8d5b7;
  --dark: #0a0a1a;
  --card-bg: rgba(65,184,131,0.08);
  --tile-shadow: 0 4px 15px rgba(65,184,131,0.3);
}

/* ===== Mahjong Tile Pattern BG ===== */
.tile-pattern {
  position: relative;
  background:
    radial-gradient(circle at 20% 30%, rgba(65,184,131,0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(212,168,83,0.1) 0%, transparent 50%),
    linear-gradient(135deg, #0a0a1a 0%, #0d1f17 30%, #0a1a14 60%, #0a0a1a 100%);
}

/* ===== Section 1: Hero ===== */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 2rem;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(65,184,131,0.2) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 80%, rgba(212,168,83,0.15) 0%, transparent 50%);
  animation: heroGlow 4s ease-in-out infinite alternate;
}
@keyframes heroGlow {
  0% { opacity: 0.6; }
  100% { opacity: 1; }
}

/* Mahjong tiles floating */
.floating-tiles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.tile {
  position: absolute;
  font-size: 3rem;
  opacity: 0.15;
  animation: floatTile 8s ease-in-out infinite;
}
.tile:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; font-size: 4rem; }
.tile:nth-child(2) { top: 20%; right: 8%; animation-delay: -2s; font-size: 2.5rem; }
.tile:nth-child(3) { top: 60%; left: 10%; animation-delay: -4s; font-size: 3.5rem; }
.tile:nth-child(4) { top: 50%; right: 5%; animation-delay: -1s; font-size: 5rem; }
.tile:nth-child(5) { bottom: 15%; left: 20%; animation-delay: -3s; font-size: 3rem; }
.tile:nth-child(6) { bottom: 25%; right: 15%; animation-delay: -5s; font-size: 2rem; }
.tile:nth-child(7) { top: 35%; left: 50%; animation-delay: -6s; font-size: 3.5rem; }
@keyframes floatTile {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-30px) rotate(5deg); }
  50% { transform: translateY(-15px) rotate(-3deg); }
  75% { transform: translateY(-40px) rotate(2deg); }
}

.hero-content {
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 900px;
}
.hero-content .qingque-icon {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 3px solid var(--jade);
  box-shadow: 0 0 30px rgba(65,184,131,0.5);
  margin-bottom: 1.5rem;
  object-fit: cover;
  background: linear-gradient(135deg, #1a3a2a, #0d1f17);
}
.hero-content h1 {
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  font-weight: 900;
  background: linear-gradient(135deg, #41b883, #7ed6a5, #d4a853, #41b883);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 3s ease infinite;
  margin-bottom: 0.5rem;
}
@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.hero-content .subtitle {
  font-size: 1.2rem;
  color: var(--jade-light);
  opacity: 0.8;
  margin-bottom: 2rem;
}
.game-card {
  display: inline-block;
  border: 4px solid var(--jade);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--tile-shadow), 0 0 60px rgba(65,184,131,0.2);
  transition: transform 0.3s;
  max-width: 600px;
  width: 100%;
  background: #0d1f17;
}
.game-card:hover { transform: scale(1.02); }
.game-card img {
  width: 100%;
  height: auto;
  display: block;
}
.game-card .label {
  padding: 0.6rem;
  text-align: center;
  font-size: 0.9rem;
  color: var(--jade-light);
  background: rgba(65,184,131,0.15);
  letter-spacing: 2px;
}

.scroll-hint {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1;
  animation: bounce 2s infinite;
  cursor: pointer;
}
.scroll-hint span {
  display: block;
  font-size: 2rem;
  color: var(--jade);
  opacity: 0.6;
}
@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(15px); }
}

/* ===== Section 2: Memory Lane ===== */
.memory-lane {
  padding: 5rem 2rem;
  position: relative;
}
.section-title {
  text-align: center;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 800;
  color: var(--jade-light);
  margin-bottom: 1rem;
}
.section-divider {
  width: 80px;
  height: 4px;
  background: linear-gradient(90deg, var(--jade), var(--gold));
  margin: 0 auto 3rem;
  border-radius: 2px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
  max-width: 1200px;
  margin: 0 auto;
}
.gallery-item {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  border: 3px solid rgba(65,184,131,0.3);
  background: #0d1f17;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 0;
  transform: translateY(40px);
  aspect-ratio: 4/3;
}
.gallery-item.revealed {
  opacity: 1;
  transform: translateY(0);
}
.gallery-item:hover {
  border-color: var(--jade);
  box-shadow: var(--tile-shadow);
  transform: translateY(-5px) scale(1.02);
  z-index: 2;
}
.gallery-item img, .gallery-item video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.gallery-item .play-icon {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.4);
  font-size: 3rem;
  opacity: 0;
  transition: opacity 0.3s;
}
.gallery-item:hover .play-icon { opacity: 1; }

/* Lightbox */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.lightbox.active { display: flex; }
.lightbox img, .lightbox video {
  max-width: 90vw;
  max-height: 85vh;
  border-radius: 8px;
  box-shadow: 0 0 40px rgba(65,184,131,0.3);
}
.lightbox .close {
  position: absolute;
  top: 2rem;
  right: 2rem;
  font-size: 2.5rem;
  color: #fff;
  cursor: pointer;
  width: 50px; height: 50px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  transition: background 0.3s;
}
.lightbox .close:hover { background: rgba(255,255,255,0.2); }

/* ===== Section 3: Blessing River ===== */
.blessing-river {
  padding: 5rem 0;
  position: relative;
  overflow: hidden;
}
.blessing-track {
  display: flex;
  gap: 2rem;
  animation: scrollBlessings 30s linear infinite;
  padding: 1rem 0;
  width: max-content;
}
.blessing-track:nth-child(even) { animation-direction: reverse; animation-duration: 36s; }
.blessing-track:nth-child(3) { animation-duration: 24s; }
.blessing-track:hover { animation-play-state: paused; }

.blessing-card {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  background: var(--card-bg);
  border: 1px solid rgba(65,184,131,0.3);
  border-radius: 50px;
  padding: 0.6rem 1.2rem 0.6rem 0.6rem;
  min-width: 200px;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}
.blessing-card:hover {
  border-color: var(--jade);
  box-shadow: var(--tile-shadow);
  transform: scale(1.1);
  background: rgba(65,184,131,0.15);
}
.blessing-card .avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  flex-shrink: 0;
  background: linear-gradient(135deg, #41b883, #d4a853);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
  color: #fff;
  font-weight: bold;
}
.blessing-card .msg {
  font-size: 0.95rem;
  white-space: nowrap;
  color: var(--cream);
}

@keyframes scrollBlessings {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ===== Section 4: Qingque Mini-Game ===== */
.game-section {
  padding: 5rem 2rem;
  text-align: center;
}
.mahjong-board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.8rem;
  max-width: 420px;
  margin: 2rem auto;
  perspective: 800px;
}
.mahjong-tile {
  aspect-ratio: 3/4;
  border-radius: 10px;
  cursor: pointer;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.mahjong-tile.flipped { transform: rotateY(180deg); }
.mahjong-tile.matched { opacity: 0.5; pointer-events: none; }
.tile-face {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  font-size: 2.5rem;
}
.tile-back {
  background: linear-gradient(145deg, #1a3a2a, #0d2f1a);
  border: 3px solid var(--jade);
  box-shadow: inset 0 0 20px rgba(65,184,131,0.1);
  color: var(--jade);
  font-size: 2rem;
}
.tile-front {
  background: linear-gradient(145deg, #2d5a3a, #1a4a2a);
  border: 3px solid var(--gold);
  transform: rotateY(180deg);
  box-shadow: 0 0 15px rgba(212,168,83,0.3);
}
.game-score {
  font-size: 1.2rem;
  color: var(--gold);
  margin: 1rem 0;
}
.game-message {
  font-size: 1.1rem;
  color: var(--jade-light);
  min-height: 2rem;
  margin-top: 1rem;
  transition: all 0.3s;
}
.game-btn {
  display: inline-block;
  padding: 0.8rem 2rem;
  background: linear-gradient(135deg, var(--jade), var(--jade-dark));
  color: #fff;
  border: none;
  border-radius: 50px;
  font-size: 1rem;
  cursor: pointer;
  margin-top: 1rem;
  transition: all 0.3s;
  letter-spacing: 1px;
}
.game-btn:hover {
  box-shadow: 0 0 25px rgba(65,184,131,0.5);
  transform: translateY(-2px);
}

/* ===== Section 5: Footer ===== */
.footer {
  padding: 4rem 2rem;
  text-align: center;
  position: relative;
  background: linear-gradient(0deg, rgba(65,184,131,0.1) 0%, transparent 100%);
}
.footer .cake {
  font-size: 5rem;
  animation: cakeBounce 1.5s ease-in-out infinite;
}
@keyframes cakeBounce {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-20px) rotate(5deg); }
}
.footer h2 {
  font-size: 2rem;
  margin: 1rem 0;
  color: var(--jade-light);
}
.footer .signature {
  color: var(--cream);
  opacity: 0.7;
  font-size: 1rem;
  margin-top: 0.5rem;
}
.footer .hashtag {
  display: inline-block;
  margin-top: 2rem;
  padding: 0.5rem 1.5rem;
  border: 1px solid var(--jade);
  border-radius: 50px;
  color: var(--jade-light);
  font-size: 0.9rem;
  opacity: 0.6;
}

/* ===== Particles ===== */
.particle {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  font-size: 1.5rem;
  animation: particleUp 2s ease-out forwards;
}
@keyframes particleUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-150px) scale(0); }
}

/* ===== Responsive ===== */
@media (max-width: 640px) {
  .gallery { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.8rem; }
  .mahjong-board { max-width: 320px; gap: 0.5rem; }
  .mahjong-tile .tile-face { font-size: 1.8rem; }
  .blessing-card { min-width: 150px; padding: 0.4rem 1rem 0.4rem 0.4rem; }
  .hero-content h1 { font-size: 2rem; }
}
</style>
</head>
<body>

<!-- ===== HERO ===== -->
<section class="hero tile-pattern">
  <div class="floating-tiles">
    <span class="tile">🀫</span><span class="tile">🀈</span><span class="tile">🀄</span>
    <span class="tile">🀆</span><span class="tile">🀋</span><span class="tile">🀊</span>
    <span class="tile">🀅</span>

  <div class="hero-content">

<!-- ===== BLESSING RIVER ===== -->
<section class="blessing-river tile-pattern" id="blessings">

</section>

<!-- ===== QINGQUE MINI-GAME ===== -->
<section class="game-section tile-pattern" id="game">
  <h2 class="section-title">青雀摸牌</h2>

  <p style="color:var(--cream);opacity:0.7;margin-bottom:1rem;">翻开麻将牌，找到相同的青雀牌吧！🀄</p>

</section>

<!-- ===== FOOTER ===== -->
<section class="footer">
  <div class="cake">🎂</div>
  <h2>秀秀，生日快乐！</h2>
  <p style="color:var(--cream);opacity:0.8;max-width:500px;margin:1rem auto;">
    愿青雀的运气一直伴你左右<br>把把天胡，天天开心！
  </p>
  <p class="signature">—— 百业全体成员 敬上</p>
  <div class="hashtag">#秀秀生日快乐 #百业Forever</div>
</section>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="close">&times;</span>
  <div id="lightboxContent"></div>
</div>

<script>
/* ===== DATA: Media items ===== */
const mediaItems = [
  // Conv1 images
  ...Array.from({length:17}, (_,i) => ({

    src: `decrypted/conv1/${[

      '734d7fa2a87def85faf421cfedade9d3','79a5a1c6acc7fc0b4d9195c47e1ee354',
      '87c260dd1656dbd962978813b81a2308','8984244f9736cf8083bfd575029544bd',
      '8d5eb48cf17b187ffef4a5b0b0807c80','8f5fec77b566e5914eacf3062118e706',
      '9c0c9148875c78299bd8dff8d1be22a8','a3364881d00418957b791b6a7c9d0679',

      'ef63f88c55de41ee91645b0425ae7195'
    ][i]}.png`,
    thumb: 'image'
  })),
  // Conv2 images
  ...Array.from({length:8}, (_,i) => ({
    type: 'image',
    src: `decrypted/conv2/${[
      '15aaf3af9a6823a2f3e4b9d219136c17','47b637c5b3dc41e1eac68423fdb8edc1',
      '62d7876e9c0f1be9910f9020bd2dc50c','8911035e982f778d167a5339d41a0ccd',
      'c3a8776ae963c9e2c6cda4ecbbb603c3','f803df5408d89e3b467c2c3fa65be351',
      'fa3f059f3443c2fb28f7e30d66692af9','fb5123b6aae33b289b96b69406c9206b'
    ][i]}.png`,
    thumb: 'image'
  })),
  // GIF
  { type: 'image', src: 'decrypted/206226ce0ee1ff6a8a4253d631c24acd_t.gif', thumb: 'gif' },
  // Videos
  { type: 'video', src: 'videos/3eb64b794631d72abd06e1dbda97b8ab.mp4', thumb: '视频1' },
  { type: 'video', src: 'videos/514ae3c93bdfb465ca8005d0cd6dc623.mp4', thumb: '视频2' },
];

/* ===== Gallery Builder ===== */
const gallery = document.getElementById('gallery');
mediaItems.forEach((item, idx) => {
  const el = document.createElement('div');
  el.className = 'gallery-item';
  el.style.transitionDelay = `${idx * 0.05}s`;
  el.onclick = () => openLightbox(item);

  if (item.type === 'video') {
    el.innerHTML = `<video src="${item.src}" preload="metadata"></video><div class="play-icon">▶️</div>`;
  } else {
    el.innerHTML = `<img src="${item.src}" alt="回忆${idx+1}" loading="lazy" onerror="this.parentElement.style.display='none'">`;
  }
  gallery.appendChild(el);
});

/* ===== Scroll Reveal ===== */
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('revealed');
  });
}, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

document.querySelectorAll('.gallery-item').forEach(el => observer.observe(el));

/* ===== Lightbox ===== */
function openLightbox(item) {
  const lb = document.getElementById('lightbox');
  const content = document.getElementById('lightboxContent');
  if (item.type === 'video') {
    content.innerHTML = `<video src="${item.src}" controls autoplay></video>`;
  } else {
    content.innerHTML = `<img src="${item.src}" alt="photo">`;
  }
  lb.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
  document.getElementById('lightboxContent').innerHTML = '';
}

/* ===== Blessing River ===== */
const blessings = [
  { name:'小月', initial:'月', msg:'秀秀生日快乐！青雀附体，把把天胡！🀄' },
  { name:'大海', initial:'海', msg:'生日快乐秀秀！新的一年继续carry我们！💪' },

  { name:'阿强', initial:'强', msg:'生日快乐！百业因你而精彩！🎉' },
  { name:'晓雨', initial:'雨', msg:'秀秀~生日快乐！愿你的每一天都闪闪发光✨' },
  { name:'小熊', initial:'熊', msg:'Happy Birthday秀秀！青雀大王保佑你！🎂' },
  { name:'老王', initial:'王', msg:'生日快乐！祝你崩铁全角色满命！' },
  { name:'小花', initial:'花', msg:'秀秀生快！你是百业最亮的星！🌟' },
  { name:'阿杰', initial:'杰', msg:'生日快乐秀秀！期待下次一起开黑！🎮' },
  { name:'小七', initial:'七', msg:'秀秀生日快乐！青雀の祝福与你同在~' },
  { name:'大白', initial:'白', msg:'秀秀生日快乐！记得天天快乐呀！' },
  { name:'梦梦', initial:'梦', msg:'生日快乐！百业 forever，秀秀 best！' },
];

// Duplicate blessings for seamless loop
const allBlessings = [...blessings, ...blessings];

function createBlessingTrack(items, speed) {
  const track = document.createElement('div');
  track.className = 'blessing-track';
  track.style.animationDuration = `${speed}s`;
  items.forEach(b => {
    const card = document.createElement('div');
    card.className = 'blessing-card';
    card.innerHTML = `<div class="avatar">${b.initial}</div><span class="msg">${b.name}: ${b.msg}</span>`;
    track.appendChild(card);
  });
  return track;
}

const blessingContainer = document.getElementById('blessing-container');
// 3 rows with different speeds and shuffled orders
blessingContainer.appendChild(createBlessingTrack(allBlessings, 35));
blessingContainer.appendChild(createBlessingTrack([...allBlessings].reverse(), 42));
blessingContainer.appendChild(createBlessingTrack(allBlessings.sort(() => Math.random()-0.5), 28));

/* ===== Qingque Mahjong Game ===== */
const tileEmojis = ['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀄'];
let tiles = [];
let flipped = [];
let matched = [];
let lockBoard = false;

function initGame() {
  tiles = [...tileEmojis, ...tileEmojis].sort(() => Math.random() - 0.5);
  flipped = [];
  matched = [];
  lockBoard = false;
  document.getElementById('matchCount').textContent = '0';
  document.getElementById('gameMessage').textContent = '';
  renderBoard();
}

function renderBoard() {
  const board = document.getElementById('mahjongBoard');
  board.innerHTML = tiles.map((emoji, i) => {
    const isFlipped = flipped.includes(i) || matched.includes(i);
    const isMatched = matched.includes(i);
    return `
      <div class="mahjong-tile ${isFlipped?'flipped':''} ${isMatched?'matched':''}"
           onclick="flipTile(${i})" data-index="${i}">
        <div class="tile-face tile-back">🀫</div>
        <div class="tile-face tile-front">${emoji}</div>
      </div>
    `;
  }).join('');
}

function flipTile(i) {
  if (lockBoard || flipped.includes(i) || matched.includes(i) || flipped.length >= 2) return;
  flipped.push(i);
  renderBoard();

  if (flipped.length === 2) {
    lockBoard = true;
    const [a, b] = flipped;
    if (tiles[a] === tiles[b]) {
      matched.push(a, b);
      flipped = [];
      lockBoard = false;
      document.getElementById('matchCount').textContent = matched.length / 2;
      renderBoard();
      spawnParticles(a);

      if (matched.length === tiles.length) {
        document.getElementById('gameMessage').textContent = '🎉 天胡！秀秀的运气真好！生日快乐！🎂';
        spawnCelebration();
      } else {
        document.getElementById('gameMessage').textContent = ['自摸！🀄','碰！','吃！','杠！'][Math.floor(Math.random()*4)];
      }
    } else {
      setTimeout(() => {
        flipped = [];
        lockBoard = false;
        renderBoard();
      }, 800);
    }
  }
}

function restartGame() {
  initGame();
}

function spawnParticles(idx) {
  const el = document.querySelector(`[data-index="${idx}"]`);
  if (!el) return;
  const rect = el.getBoundingClientRect();
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = ['✨','💚','🀄','🌟','💫','🎴'][i];
    p.style.left = rect.left + rect.width/2 + (Math.random()-0.5)*60 + 'px';
    p.style.top = rect.top + 'px';
    p.style.animationDuration = (1.5 + Math.random()) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2000);
  }
}

function spawnCelebration() {
  for (let i = 0; i < 20; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = ['🎂','🎉','✨','💚','🀄','🎊'][Math.floor(Math.random()*6)];
      p.style.left = Math.random() * window.innerWidth + 'px';
      p.style.top = Math.random() * window.innerHeight * 0.6 + 'px';
      p.style.fontSize = (2 + Math.random()*3) + 'rem';
      p.style.animationDuration = (2 + Math.random()*2) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 3000);
    }, i * 100);
  }
}

/* ===== Init ===== */
initGame();

// Keyboard: ESC closes lightbox
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});
</script>
